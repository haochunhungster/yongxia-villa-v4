<section><h2>設計參考 <span class="n">3</span></h2><div class="grid"><figure><img loading="lazy" src="img/ref01.jpg" alt="" data-full="img/ref01.jpg"><figcaption><b>游泳池區透視配置圖</b><br>室內配置參考：吧檯 3m｜圓桌休閒 3 桌｜長餐桌 12 人｜靜謐流水牆 2m 以上｜游泳池 寬 4m｜植栽 2m｜玻璃廚房</figcaption></figure><figure><img loading="lazy" src="img/ref02.jpg" alt="" data-full="img/ref02.jpg"><figcaption><b>夜間剖視鳥瞰</b><br>無屋頂剖視：起居／長餐桌／吧檯／電梯／樓梯 ＋ 側向玻璃罩泳池</figcaption></figure><figure><img loading="lazy" src="img/ref03.jpg" alt="" data-full="img/ref03.jpg"><figcaption><b>佈局 A 剖視鳥瞰夜景</b><br>早期佈局研究</figcaption></figure></div></section><section><h2>配置與尺寸 <span class="n">5</span></h2><div class="grid"><figure><img loading="lazy" src="img/plan01.jpg" alt="" data-full="img/plan01.jpg"><figcaption><b>v4 配置</b><br>北側 3m 外推帶（玻璃廚房／吧台／12 人長桌）＋ 玻璃翼（泳池），北緣切齊 y = −3.00</figcaption></figure><figure><img loading="lazy" src="img/plan02.jpg" alt="" data-full="img/plan02.jpg"><figcaption><b>v4 量體圖</b><br>等角量體：石造三層 ＋ 北側低矮玻璃帶 ＋ 玻璃翼</figcaption></figure><figure><img loading="lazy" src="img/plan03.jpg" alt="" data-full="img/plan03.jpg"><figcaption><b>v3 配置</b><br>前一版：玻璃翼貼田地邊，泳池區獨立</figcaption></figure><figure><img loading="lazy" src="img/plan04.jpg" alt="" data-full="img/plan04.jpg"><figcaption><b>v3 量體圖</b><br>等角量體</figcaption></figure><figure><img loading="lazy" src="img/plan05.jpg" alt="" data-full="img/plan05.jpg"><figcaption><b>尺寸基準</b><br>建物 29.00 × 14.85 m｜泳池 9.485 × 4.00 m｜比例 1/150</figcaption></figure></div></section><section><h2>通長空間 — 廚房→吧台→長桌→泳池 <span class="n">8</span></h2><div class="grid"><figure><img loading="lazy" src="img/h01.jpg" alt="" data-full="img/h01.jpg"><figcaption><b>廚房內部　晨光</b><br></figcaption></figure><figure><img loading="lazy" src="img/h02.jpg" alt="" data-full="img/h02.jpg"><figcaption><b>吧台夜景　黃銅暖光</b><br></figcaption></figure><figure><img loading="lazy" src="img/h03.jpg" alt="" data-full="img/h03.jpg"><figcaption><b>長桌白天　滿座</b><br></figcaption></figure><figure><img loading="lazy" src="img/h04.jpg" alt="" data-fu
